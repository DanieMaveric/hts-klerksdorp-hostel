<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HTS Klerksdorp Hostel — Staff Management &amp; Operations PWA</title>
  <meta name="description" content="Hostel Staff Management & Operations PWA for HTS Klerksdorp — discipline, roll call, room inspections, parent records and 2027 enrolments." />
  <meta name="theme-color" content="#0d2a4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HTS Hostel" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Top Brand Bar ===== -->
  <header class="brandbar">
    <div class="brandbar__inner">
      <div class="crest" aria-hidden="true">HTS</div>
      <div class="brandbar__text">
        <h1 class="brandbar__school">HTS Klerksdorp</h1>
        <p class="brandbar__motto">UBERRIMAE FIDEI</p>
        <p class="brandbar__sub">Hostel Staff Management &amp; Operations PWA</p>
      </div>
    </div>
  </header>

  <!-- ===== Duty / Staff Strip ===== -->
  <div class="dutystrip">
    <div class="dutystrip__inner">
      <span class="dutystrip__duty">Duty: <strong id="dutyName">—</strong></span>
      <span class="pill pill--staff" id="adminBadge">
        <span class="dot"></span> Signed out
      </span>
      <span class="pill pill--staff">Staff: <strong id="staffName">—</strong></span>
      <span class="pill pill--muted" id="syncPill"><span class="dot"></span> Local only</span>
      <button class="linkbtn" id="btnSignOut" type="button" hidden>Sign out</button>
    </div>
  </div>

  <!-- ===== Primary Navigation ===== -->
  <nav class="tabs" aria-label="Sections">
    <div class="tabs__inner" id="tabsInner">
      <button class="tab is-active" data-view="dashboard" type="button">Dashboard</button>
      <button class="tab" data-view="merits" type="button">Merits &amp; Discipline</button>
      <button class="tab" data-view="attendance" type="button">Roll Call</button>
      <button class="tab" data-view="rooms" type="button">Room Checks</button>
      <button class="tab" data-view="roomsAdmin" data-owner-only type="button" hidden>Rooms</button>
      <button class="tab" data-view="parents" type="button">Parents</button>
      <button class="tab" data-view="bookings" type="button">2027 Bookings</button>
      <button class="tab" data-view="broadcast" type="button">Broadcast</button>
      <button class="tab" data-view="admin" data-owner-only type="button" hidden>Admin</button>
    </div>
  </nav>

  <main class="wrap" id="app">
    <!-- Views are rendered here by app.js -->
  </main>

  <footer class="foot">
    <p>HTS Klerksdorp Hostel • UBERRIMAE FIDEI • Offline-ready PWA</p>
    <p class="foot__small">Shared live data — what one staff member saves appears on every phone. Owner: D Smit.</p>
  </footer>

  <!-- ===== Login gate ===== -->
  <div class="gate" id="gate" hidden></div>

  <!-- ===== Modal host ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <h2 id="modalTitle">Dialog</h2>
        <button class="iconbtn" data-close type="button" aria-label="Close">×</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
